<!DOCTYPE html>
<html lang="en">
<head>
  <title>quattr.one</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="quattr.one" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="quattr.one" />
  <meta property="og:url" content="https://quattr.one" />
  <meta property="og:description" content="hello!" />
  <meta property="og:image" content="https://quattrr.github.io/kirby.png" />
  <meta name="theme-color" content="#d3d6f1" />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; }

    .main {
      position: relative;
      background-color: #181614; 
      background-image: radial-gradient(rgba(45, 42, 38, 0.9), #0f0d0c 120%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: hsl(39deg 30% 64%); 
      font-family: monospace;
      text-shadow:
        0 0 10px hsl(39deg 30% 64% / 0.4),
        0 0 15px hsl(39deg 30% 64% / 0.3),
        0 0 20px hsl(39deg 30% 64% / 0.2),
        0 0 25px hsl(39deg 30% 64% / 0.1);
    }

    .main::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: repeating-linear-gradient(
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 150px rgba(0, 0, 0, 0.85) inset;
      pointer-events: none;
    }

    .content {
      min-height: 200px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      pointer-events: all;
    }

    .title {
      margin: 0;
      font-size: 3.5rem;
      display: block;
      margin-bottom: 24px;
      letter-spacing: -3px;
    }

    .cursor {
      background: hsl(39deg 30% 64%);
      width: 0.5em;
      height: 1em;
      display: inline-block;
      box-shadow:
        0 0 10px hsl(39deg 30% 64% / 0.4),
        0 0 15px hsl(39deg 30% 64% / 0.3),
        0 0 20px hsl(39deg 30% 64% / 0.2),
        0 0 25px hsl(39deg 30% 64% / 0.1);
      top: 4px;
      left: -24px;
      position: relative;
      animation: 1.3s infinite blink;
    }

    @keyframes blink {
      0% { opacity: 0; }
      49% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 1; }
    }

    .main a {
      color: inherit;
      text-decoration: underline;
      transition: text-shadow 0.1s linear;
    }

    .main a:hover {
      text-shadow:
        0 0 12px hsl(39deg 30% 64% / 0.7),
        0 0 17px hsl(39deg 30% 64% / 0.4),
        0 0 22px hsl(39deg 30% 64% / 0.4),
        0 0 27px hsl(39deg 30% 64% / 0.3);
    }

    .main a:visited {
      color: hsl(39deg 30% 64%);
    }

    .list {
      display: block;
      list-style: none;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* --- marquee banner strip (replaces telegram/bio/time list) --- */
    .marquee {
      width: 100%;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    }

    .marquee-track {
      display: flex;
      align-items: center;
      gap: 16px;
      width: max-content;
      animation: marquee-scroll 22s linear infinite;
    }

    .marquee:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-track img {
      display: block;
      width: 88px;
      height: 31px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 4px hsl(39deg 30% 64% / 0.25));
      flex-shrink: 0;
      transition: filter 0.15s linear;
    }

    /* only the button_88x31_1x gif is wrapped in a link, so this only affects that one */
    .marquee-track a:hover img {
      filter: drop-shadow(0 0 8px hsl(39deg 30% 64% / 0.5));
    }

    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .marquee-heading {
      font-size: 1.2rem;
      margin-top: 28px;
      margin-bottom: 10px;
      display: block;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 2.5rem;
        letter-spacing: -2px;
      }
      .cursor {
        left: -16px;
      }
    }
  </style>
</head>
<body>
  <main class="main">
    <div class="vignette"></div>
    <div class="content">
      <h1 class="title">quattr.one
        <span class="cursor"></span>
      </h1>

      <ul class="list">
        <li>email: &nbsp;&nbsp;&nbsp;<a href="mailto:root@quattr.one">root@quattr.one</a></li>
        <li>telegram: <a href="https://t.me/alexfne" target="_blank">@alexfne</a></li>
      </ul>

      <span class="marquee-heading">people</span>
      <div class="marquee">
        <div class="marquee-track" id="marquee-track">
          <!-- content is duplicated once via JS for a seamless loop -->
          <a href="https://alex.quattr.one" rel="noopener">
            <img src="https://raw.githubusercontent.com/quattrr/.one/main/button_88x31_1x.gif" alt="button" width="88" height="31" loading="lazy" />
          </a>
          <a href="mailto:root@quattr.one" rel="noopener">
            <img src="https://raw.githubusercontent.com/quattrr/.one/main/button_88x31_1x%20(2).gif" alt="button" width="88" height="31" loading="lazy" />
          </a>
          <img src="https://raw.githubusercontent.com/quattrr/.one/main/baero.gif" alt="baero" width="88" height="31" loading="lazy" />
          <img src="https://raw.githubusercontent.com/quattrr/.one/main/imagine.gif" alt="imagine" width="88" height="31" loading="lazy" />
        </div>
      </div>

    </div>
  </main>

  <script>
    // duplicate marquee content once so the loop is seamless
    (function () {
      const track = document.getElementById('marquee-track');
      track.innerHTML += track.innerHTML;
    })();
  </script>
</body>
</html>
