<!DOCTYPE html>
<html lang="en">
<head>
  <title>quattr.one</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="quattr.one" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="quattr.one" />
  <meta property="og:url" content="https://quattr.one" />
  <meta property="og:description" content="hello!" />
  <meta property="og:image" content="https://quattrr.github.io/kirby.png" />
  <meta name="theme-color" content="#d3d6f1" />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; }

    .main {
      position: relative;
      background-color: #181614; 
      background-image: radial-gradient(rgba(45, 42, 38, 0.9), #0f0d0c 120%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: hsl(39deg 30% 64%); 
      font-family: monospace;
      text-shadow:
        0 0 10px hsl(39deg 30% 64% / 0.4),
        0 0 15px hsl(39deg 30% 64% / 0.3),
        0 0 20px hsl(39deg 30% 64% / 0.2),
        0 0 25px hsl(39deg 30% 64% / 0.1);
    }

    .main::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: repeating-linear-gradient(
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 150px rgba(0, 0, 0, 0.85) inset;
      pointer-events: none;
    }

    .content {
      min-height: 200px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      pointer-events: all;
    }

    .title {
      margin: 0;
      font-size: 3.5rem;
      display: block;
      margin-bottom: 24px;
      letter-spacing: -3px;
    }

    .cursor {
      background: hsl(39deg 30% 64%);
      width: 0.5em;
      height: 1em;
      display: inline-block;
      box-shadow:
        0 0 10px hsl(39deg 30% 64% / 0.4),
        0 0 15px hsl(39deg 30% 64% / 0.3),
        0 0 20px hsl(39deg 30% 64% / 0.2),
        0 0 25px hsl(39deg 30% 64% / 0.1);
      top: 4px;
      left: -24px;
      position: relative;
      animation: 1.3s infinite blink;
    }

    @keyframes blink {
      0% { opacity: 0; }
      49% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 1; }
    }

    .list {
      display: block;
      list-style: none;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .main a {
      color: inherit;
      text-decoration: underline;
      transition: text-shadow 0.1s linear;
    }

    .main a:hover {
      text-shadow:
        0 0 12px hsl(39deg 30% 64% / 0.7),
        0 0 17px hsl(39deg 30% 64% / 0.4),
        0 0 22px hsl(39deg 30% 64% / 0.4),
        0 0 27px hsl(39deg 30% 64% / 0.3);
    }

    .main a:visited {
      color: hsl(39deg 30% 64%);
    }

    #tz-comparison {
      opacity: 0.7;
      font-size: 0.95rem;
      margin-left: 8px;
    }

    .desktop-only {
      display: list-item;
    }

    /* --- badges (88x31 webring style) --- */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .badges img, .badges svg {
      display: block;
      width: 88px;
      height: 31px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 4px hsl(39deg 30% 64% / 0.25));
      transition: filter 0.15s linear, transform 0.15s linear;
    }

    .badges a:hover img, .badges a:hover svg {
      filter: drop-shadow(0 0 8px hsl(39deg 30% 64% / 0.5));
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .title {
        font-size: 2.5rem;
        letter-spacing: -2px;
      }
      .cursor {
        left: -16px;
      }
      .list {
        font-size: 1rem;
      }
      #tz-comparison {
        display: block; 
        margin-left: 0;
        margin-top: 4px;
      }
      .desktop-only {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="main">
    <div class="vignette"></div>
    <div class="content">
      <h1 class="title">quattr.one
        <span class="cursor"></span>
      </h1>
      <ul class="list">
        <li>telegram: <a href="https://t.me/alexfne" target="_blank">@alexfne</a></li>
        <li>bio: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="https://bio.quattr.one" target="_blank">bio.quattr.one</a></li>
        <li>time: &nbsp;<span id="live-time">00:00</span> <span id="tz-comparison"></span></li>
      </ul>

      <div class="badges">
        <!-- Animated SVG Badge -->
        <a href="https://quattr.one" rel="noopener">
          <svg width="88" height="31" viewBox="0 0 88 31" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&family=Share+Tech+Mono&family=Silkscreen:wght@400;700&family=Space+Mono&family=VT323&display=swap');
                
                @keyframes cycleText_0 {
                  0%, 0.00% { opacity: 0; }
                  0.00% { opacity: 1; }
                  39.86% { opacity: 1; }
                  42.86%, 100% { opacity: 0; }
                }
                .frame-text-0 {
                  animation: cycleText_0 7s infinite;
                  opacity: 0;
                }
                
                @keyframes cycleText_1 {
                  0%, 42.86% { opacity: 0; }
                  45.86% { opacity: 1; }
                  82.71% { opacity: 1; }
                  85.71%, 100% { opacity: 0; }
                }
                .frame-text-1 {
                  animation: cycleText_1 7s infinite;
                  opacity: 0;
                }
                
                @keyframes cycleText_2 {
                  0%, 85.71% { opacity: 0; }
                  87.43% { opacity: 1; }
                  98.29% { opacity: 1; }
                  100.00%, 100% { opacity: 0; }
                }
                .frame-text-2 {
                  animation: cycleText_2 7s infinite;
                  opacity: 0;
                }
                
                .btn-text {
                  fill: #D1BB95;
                  font-family: 'VT323', monospace;
                  font-size: 15px;
                  text-anchor: middle;
                  dominant-baseline: middle;
                  text-shadow: 0 0 4px #D1BB9580;
                }
                .scanlines { fill: url(#scanlinePattern); opacity: 0.15; pointer-events: none; }
                .crt-flicker {
                  animation: flicker 0.15s infinite;
                  opacity: 0.04;
                  fill: #ffffff;
                }
                @keyframes flicker {
                  0% { opacity: 0.02; }
                  50% { opacity: 0.06; }
                  100% { opacity: 0.02; }
                }
              </style>
              <pattern id="scanlinePattern" x="0" y="0" width="100%" height="2" patternUnits="userSpaceOnUse">
                <rect width="100%" height="1" fill="#000000" />
              </pattern>
            </defs>

            <!-- Outer Border & Background -->
            <rect x="0.5" y="0.5" width="87" height="30" rx="2" fill="#0a0a0a" stroke="#D1BB95" stroke-width="1" />

            <!-- Inner Bevel Screen Background -->
            <rect x="2" y="2" width="84" height="27" rx="1" fill="#1a1a1a" />

            <!-- Animated Text Layers -->
            <text x="44" y="16" class="btn-text frame-text-0">quattr.one</text>
            <text x="44" y="16" class="btn-text frame-text-1">4ne</text>
            <text x="44" y="16" class="btn-text frame-text-2"></text>

            <!-- Scanlines Overlay -->
            <rect x="1" y="1" width="86" height="29" rx="1" class="scanlines" />

            <!-- CRT Flicker -->
            <rect x="1" y="1" width="86" height="29" rx="1" class="crt-flicker" />

            <!-- Inner Bezel Top/Left Highlight -->
            <line x1="1" y1="1" x2="87" y2="1" stroke="#D1BB95" stroke-width="0.5" stroke-opacity="0.3" />
            <line x1="1" y1="1" x2="1" y2="30" stroke="#D1BB95" stroke-width="0.5" stroke-opacity="0.3" />
          </svg>
        </a>
        
        <!-- Original Badges -->
        <a href="https://quattr.one/imagine.gif" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/quattrr/.one/main/imagine.gif" alt="imagine" width="88" height="31" loading="lazy" />
        </a>
        <a href="https://quattr.one/bestvieweddesktop.gif" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/quattrr/.one/main/bestvieweddesktop.gif" alt="best viewed on desktop" width="88" height="31" loading="lazy" />
        </a>
        <a href="https://quattr.one/baero.gif" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/quattrr/.one/main/baero.gif" alt="baero" width="88" height="31" loading="lazy" />
        </a>
      </div>
    </div>
  </main>

  <script>
    function updateTimezone() {
      const now = new Date();

      const timeOptions = { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hour12: false };
      const tzOptions = { timeZone: 'Europe/Rome', timeZoneName: 'short' };
      
      const timeString = new Intl.DateTimeFormat('en-US', timeOptions).format(now);
      const tzNameString = new Intl.DateTimeFormat('en-US', tzOptions).format(now).split(' ').pop();

      document.getElementById('live-time').textContent = `${timeString} ${tzNameString}`;

      const getZoneRecord = (tz) => {
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric',
          hour: 'numeric', minute: 'numeric', hour12: false
        });
        const parts = formatter.formatToParts(new Date()).reduce((acc, p) => ({ ...acc, [p.type]: p.value }), {});
        return Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute);
      };

      try {
        const localMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes());
        const targetMs = getZoneRecord('Europe/Rome');
        const diffHours = Math.round((targetMs - localMs) / (1000 * 60 * 60));

        let comparisonText = "";
        if (diffHours === 0) {
          comparisonText = "(same timezone)";
        } else if (diffHours > 0) {
          comparisonText = `(${diffHours}h ahead of you)`;
        } else {
          comparisonText = `(${Math.abs(diffHours)}h behind you)`;
        }
        
        document.getElementById('tz-comparison').textContent = comparisonText;
      } catch (e) {
        document.getElementById('tz-comparison').textContent = "";
      }
    }

    updateTimezone();
    setInterval(updateTimezone, 60000);
  </script>
</body>
</html>
